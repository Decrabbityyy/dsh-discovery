packages:
  - 'llm-discovery'
  - 'ui-settings-discovery'
  - 'llm-dynamic-provider'

# Harness packages (@deepseek-ai/dsh-*) resolve from npm as ordinary
# dependencies — the 0.1.7-rc channel carries the full internal dependency
# graph, so no Harness checkout is needed to build or test. Peers stay declared
# (the host injects these modules at runtime) but are NOT auto-installed: each
# package pins the compile-time copy it builds against in devDependencies —
# 0.1.7-rc.2, the host line the peer ranges accept.
autoInstallPeers: false

# Pure-JS transitive dependencies of pi-ai; neither needs its install script.
allowBuilds:
  '@google/genai': false
  protobufjs: false

# Versions this repo pins that are younger than the configured minimum release age.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cordis-plugin-include@1.0.9'
  - '@deepseek-ai/cordis-plugin-loader@1.0.5'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-api-remotes@0.1.7-rc.2'
  - '@deepseek-ai/dsh-attachment@0.1.7-rc.2'
  - '@deepseek-ai/dsh-authorization@0.1.7-rc.2'
  - '@deepseek-ai/dsh-brand@0.1.7-rc.2'
  - '@deepseek-ai/dsh-client-connection@0.1.7-rc.2'
  - '@deepseek-ai/dsh-client-ui-renderer@0.1.7-rc.2'
