name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Harness packages resolve from npm (@alpha/@next channels) as ordinary
      # dependencies — no Harness checkout needed. Single-repo install.
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
      - name: Test plugin workspace
        run: pnpm -r run test
      - name: Build plugin workspace
        run: pnpm -r run build
      - name: Publish versions missing from npmjs
        shell: bash
        run: |
          set -euo pipefail

          publish_if_missing() {
            local directory="$1"
            local name version status
            name="$(node -p "require('./${directory}/package.json').name")"
            version="$(node -p "require('./${directory}/package.json').version")"

            if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::$name@$version does not match tag $GITHUB_REF_NAME"
              return 1
            fi

            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/${name}/${version}")"
            case "$status" in
              200)
                echo "::notice::Skipping $name@$version because npmjs already has it"
                ;;
              404)
                pnpm --filter "$name" publish --no-git-checks
                ;;
              *)
                echo "::error::npmjs returned HTTP $status while checking $name@$version"
                return 1
                ;;
            esac
          }

          publish_if_missing llm-discovery
          publish_if_missing llm-dynamic-provider
          publish_if_missing ui-settings-discovery
