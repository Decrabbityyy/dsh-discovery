name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The plugin workspace's tsconfigs reference the Harness sources at
      # ../../ (tsconfig project references and tsconfig.base.json paths), so
      # this repo must sit inside a Harness checkout as harness/third-plugin.
      - uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          path: harness
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: harness/third-plugin
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # The plugin compiles against Harness TypeScript sources, not built
      # artifacts, so installing dependencies is enough — no Harness build.
      - name: Install Harness dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Install plugin dependencies
        working-directory: harness/third-plugin
        run: pnpm install --frozen-lockfile
      - name: Test plugin workspace
        working-directory: harness/third-plugin
        run: pnpm -r run test
      - name: Build plugin workspace
        working-directory: harness/third-plugin
        run: pnpm -r run build
      - name: Publish versions missing from npmjs
        working-directory: harness/third-plugin
        shell: bash
        run: |
          set -euo pipefail

          publish_if_missing() {
            local directory="$1"
            local name version status
            name="$(node -p "require('./${directory}/package.json').name")"
            version="$(node -p "require('./${directory}/package.json').version")"

            if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::$name@$version does not match tag $GITHUB_REF_NAME"
              return 1
            fi

            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/${name}/${version}")"
            case "$status" in
              200)
                echo "::notice::Skipping $name@$version because npmjs already has it"
                ;;
              404)
                pnpm --filter "$name" publish --no-git-checks
                ;;
              *)
                echo "::error::npmjs returned HTTP $status while checking $name@$version"
                return 1
                ;;
            esac
          }

          publish_if_missing llm-discovery
          publish_if_missing llm-dynamic-provider
          publish_if_missing ui-settings-discovery
